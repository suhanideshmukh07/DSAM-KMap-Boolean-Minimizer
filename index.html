<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K‑Map + Quine‑McCluskey Boolean Logic Minimizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/kmap.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <span>LOGIC MINIMIZER</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <div class="menu-category">Main</div>
        <button class="nav-item active" data-target="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-target="solver">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          <span>Solver</span>
        </button>

        <div class="menu-category">Analysis</div>
        <button class="nav-item" data-target="kmap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line><line x1="12" y1="3" x2="12" y2="21"></line></svg>
          <span>K-Map</span>
        </button>
        <button class="nav-item" data-target="qm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          <span>Quine–McCluskey</span>
        </button>
        <button class="nav-item" data-target="verification">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <span>Verification</span>
        </button>
        <button class="nav-item" data-target="circuit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="12" r="3"></circle><line x1="8.59" y1="7.41" x2="15.42" y2="10.59"></line><line x1="8.59" y1="16.59" x2="15.42" y2="13.41"></line></svg>
          <span>Logic Circuit</span>
        </button>
        <button class="nav-item" data-target="comparison">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>SOP vs POS</span>
        </button>
        <button class="nav-item" data-target="complexity">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          <span>Complexity</span>
        </button>

        <div class="menu-category">Learning</div>
        <button class="nav-item" data-target="practice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
          <span>Practice</span>
        </button>
        <button class="nav-item" data-target="autotest">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Auto Testing</span>
        </button>
        <button class="nav-item" data-target="learn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>Learn</span>
        </button>

        <div class="menu-category">Other</div>
        <button class="nav-item" data-target="about">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <span>About</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle-btn" id="btn-theme-toggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <span id="theme-btn-label">Dark Mode</span>
        </button>
      </div>
    </aside>

    <!-- MAIN VIEW AREA -->
    <main class="app-main">
      <header class="app-topbar">
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <button class="btn-sidebar-toggle" id="btn-toggle-sidebar" aria-label="Toggle menu">☰</button>
          <div class="topbar-title" id="page-heading">Dashboard</div>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-secondary btn-sm" id="btn-download-report" title="Download comprehensive report">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Download Report</span>
          </button>
          <button class="btn btn-secondary btn-sm" id="btn-print-report" title="Print or save PDF report">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            <span>Print Report</span>
          </button>
          <button class="btn btn-primary btn-sm" id="btn-topbar-solver">
            <span>Solve New Function</span>
          </button>
        </div>
      </header>

      <div class="content-scroll" id="content">
        <!-- Content will be injected dynamically by main.js -->
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/truthTable.js"></script>
  <script src="js/kmap.js"></script>
  <script src="js/quinemccluskey.js"></script>
  <script src="js/verification.js"></script>
  <script src="js/circuit.js"></script>
  <script src="js/sopPosCompare.js"></script>
  <script src="js/nandNor.js"></script>
  <script src="js/complexity.js"></script>
  <script src="js/autoTest.js"></script>
  <script src="js/report.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
